  "name": "Data Workspace Framework",
  "status": "reference-pilot",
  "adapter": "react",
  "application_contract": {
    "required_layout_import": "AttioFramework"
  },
  "purpose": "A dense, calm workspace for data-heavy products with collections, configurable tables, record detail pages, contextual actions and optional boards. CRM is one preset, not the pack's required product scope.",
  "select_for": [
    "data-heavy workspace apps with a compact rail, dense table and contextual record detail",
    "asset registries, content inventories, research directories and operational catalogs when the requested interaction pattern fits",
    "CRM or any relationship tracker, whether or not the customer says CRM",
    "customers, clients, contacts, companies or accounts with details and history",
    "leads, deals, opportunities or a sales pipeline",
    "candidates and recruiting pipelines",
    "investors, donors, members, partners, vendors or suppliers",
    "logging calls, emails, meetings and notes against a record",
    "follow-ups, renewals, stages or scoring for those records"
  ],
  "avoid_for": [
    "calendar-first booking flows without record collections",
    "message delivery or campaign editing without collection and record interactions",
    "media capture and playback without a data workspace",
    "an established product design the customer asked to preserve"
  ],
